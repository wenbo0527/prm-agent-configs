name: 脱敏扫描

# 自动扫描 PR / push 是否含敏感信息（真实姓名 / IP / token / 任务 ID / 项目代号）
# 误报说明：SOP 文件中的示例（如 TASK-20260813-001）用短哈希格式，合规。
# 真任务 ID 格式：TASK-YYYYMMDD-[A-Z0-9]{6,}（如 TASK-20260813-1FF65239）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desensitization-check:
    runs-on: ubuntu-latest
    name: 🔒 脱敏红线扫描
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔍 扫描敏感信息
        id: scan
        run: |
          echo "::group::扫描敏感关键词"
          SENSITIVE_FOUND=0

          # 1. 飞书 open_id（必查 · 唯一例外：脱敏 SOP 文档中的反例）
          if grep -rE "ou_[a-f0-9]{16,}" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               . | grep -v "docs/脱敏SOP.md"; then
            echo "❌ 发现飞书 open_id"
            SENSITIVE_FOUND=1
          fi

          # 2. GitHub / API token（必查 · 唯一例外：脱敏 SOP 文档）
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|gho_[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,})" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               . | grep -v "docs/脱敏SOP.md"; then
            echo "❌ 发现 API token"
            SENSITIVE_FOUND=1
          fi

          # 3. 真实 IP（必查 · 唯一例外：脱敏 SOP 和 TOOLS 模板中的示例）
          if grep -rE "(192\.168\.[0-9]|10\.0\.[0-9]|118\.196\.79)" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               . | grep -v "docs/脱敏SOP.md" | grep -v "templates/TOOLS.md.template"; then
            echo "❌ 发现真实 IP"
            SENSITIVE_FOUND=1
          fi

          # 4. 真实姓名（必查 · 唯一例外：脱敏 SOP 文档中的反例）
          if grep -rE "(文博|张三|李四)" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               . | grep -v "docs/脱敏SOP.md"; then
            echo "❌ 发现真实姓名"
            SENSITIVE_FOUND=1
          fi

          # 5. 真任务 ID（日期 + 6+ 哈希位）· SOP 示例用短哈希不算
          # 真格式：TASK-YYYYMMDD-[A-Z0-9]{6,}
          # SOP 示例：TASK-20260813-001（短哈希，3位）不算
          if grep -rE "TASK-202[0-9]{4}-[A-Z0-9]{6,}" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               .; then
            echo "❌ 发现真任务 ID（长哈希格式）"
            SENSITIVE_FOUND=1
          fi

          # 6. 候选号（必查 · 唯一例外：反冗长范式和脱敏 SOP 中的反例）
          if grep -rE "候选 #[0-9]{3}" \
               --include="*.md" --include="*.template" \
               --exclude-dir=".git" --exclude-dir=".github" \
               . | grep -v "docs/脱敏SOP.md" | grep -v "lessons/反冗长-3段式汇报.md"; then
            echo "❌ 发现内部候选号"
            SENSITIVE_FOUND=1
          fi

          echo "::endgroup::"

          if [ $SENSITIVE_FOUND -eq 1 ]; then
            echo "::error::❌ 脱敏扫描失败，请参考 docs/脱敏SOP.md 修复后重试"
            exit 1
          fi

          echo "✅ 脱敏扫描通过：无真实姓名/IP/token/任务 ID/项目代号"

      - name: ✅ 通过
        if: success()
        run: |
          echo "🎉 脱敏扫描通过，可以合并"